const firebaseApp =

/* =========================
   小工具
========================= */

function escapeHTML(text){

  return String(text ?? "")
  .replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );

}


function createRoomCode(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(let i=0;i<6;i++){

    result +=
    chars[
      Math.floor(
        Math.random() *
        chars.length
      )
    ];

  }

  return result;

}


function baseURL(){

  return (
    location.origin +
    location.pathname
  );

}


function showError(
  title,
  error
){

  console.error(error);

  app.innerHTML = `

    <h1>
      ${escapeHTML(title)}
    </h1>

    <p class="muted danger">
      ${escapeHTML(
        error?.message ||
        error
      )}
    </p>

    <button
      class="secondary"
      id="errorHome"
    >
      回首頁
    </button>

  `;

  document
  .querySelector("#errorHome")
  .onclick = () => {

    location.href =
    baseURL();

  };

}


/* =========================
   首頁
========================= */

function home(){

  if(unsubscribe){

    unsubscribe();

    unsubscribe = null;

  }

  const params =

  );

  const roomFromURL =

/* =========================
   老公建立房間
========================= */

async function createRoom(){

  app.innerHTML = `

    <h1>
      建立房間中…
    </h1>

    <p class="muted">
      正在產生專屬房間碼。
    </p>

  `;


  try{

    for(
      let attempt=0;
      attempt<6;
      attempt++
    ){

      const room =
      createRoomCode();


      const ref =
      doc(
        db,
        "rooms",
        room
      );


      const existing =
      await getDoc(ref);


      if(existing.exists()){

        continue;

      }


      await setDoc(
        ref,
        {

          hostUid:
          currentUser.uid,

          wifeUid:
          null,

          status:
          "waiting",

          answers:
          [],

          createdAt:
          serverTimestamp(),

          updatedAt:
          serverTimestamp()

        }
      );


      history.replaceState(
        {},
        "",
        `${baseURL()}?host=1&room=${room}`
      );


      hostView(room);

      return;

    }


    throw new Error(
      "無法產生房間碼，請重新整理後再試。"
    );

  }
  catch(error){

    showError(
      "建立房間失敗",
      error
    );

  }

}


/* =========================
   老公端畫面
========================= */

function hostView(room){

  if(unsubscribe){

    unsubscribe();

  }


  const ref =
  doc(
    db,
    "rooms",
    room
  );


  unsubscribe =
  onSnapshot(

    ref,

    snapshot => {

      if(
        !snapshot.exists()
      ){

        showError(
          "房間不存在",
          "這個房間可能已經被刪除。"
        );

        return;

      }


      const data =
      snapshot.data();


      if(
        data.hostUid !==
        currentUser.uid
      ){

        showError(
          "不是老公端",
          "這支裝置不是這個房間的建立者。"
        );

        return;

      }


      const answers =
      Array.isArray(
        data.answers
      )
      ? data.answers
      : [];


      const shareURL =

      `${baseURL()}?room=${room}`;


      let rows = "";


      QUESTIONS.forEach(
        (question,index) => {

          const answer =
          answers[index];


          if(!answer){

            rows += `

              <div class="result">

                <span class="tag">
                  第 ${index+1} 題
                </span>

                <br>

                等待老婆選擇…

              </div>

            `;

          }
          else{

            const text =

            answer === "A"

            ? question.a

            : question.b;


            rows += `

              <div class="result">

                <span class="tag">
                  第 ${index+1} 題
                </span>

                <br>

                <strong>
                  ${answer}
                </strong>

                ·

                ${escapeHTML(text)}

              </div>

            `;

          }

        }
      );


      app.innerHTML = `

        <div class="small muted">
          老公端
        </div>


        <div class="room">
          ${room}
        </div>


        <div class="status">

          ${
            data.wifeUid

            ? `
              <span class="ok">
                ● 老婆已加入房間
              </span>
            `

            : `
              ○ 等待老婆從 LINE
              打開遊戲連結…
            `
          }

        </div>


        <p class="muted">

          把下面的遊戲連結
          傳給老婆：

        </p>


        <code>
          ${escapeHTML(shareURL)}
        </code>


        <button
          class="primary"
          id="shareGame"
        >
          分享／複製到 LINE
        </button>


        <div class="status">

          遊戲進度：

          ${answers.length}

          /

          ${QUESTIONS.length}

        </div>


        ${rows}


        <button
          class="secondary"
          id="backHome"
        >
          回首頁
        </button>

      `;


      document
      .querySelector("#shareGame")
      .onclick = () => {

        shareGame(
          room,
          shareURL
        );

      };


      document
      .querySelector("#backHome")
      .onclick = () => {

        history.replaceState(
          {},
          "",
          baseURL()
        );

        home();

      };

    },


    error => {

      showError(
        "讀取房間失敗",
        error
      );

    }

  );

}
